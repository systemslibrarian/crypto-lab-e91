name: Deploy to GitHub Pages

# One workflow, one gate. This lab used to split them: ci.yml ran npm ci, the
# build and the engine tests on pull_request, and deploy.yml ran the browser
# gate on push to main. Dependabot's auto-merge hung off the lighter of the two,
# so a bump only had to satisfy the build and the engine tests to land on main --
# and then the deploy, which also runs the axe WCAG scan and the rendered-claim
# e2e suite, would fail. Nothing went red in between: the PR was green, the merge
# was clean, and main just quietly stopped shipping.
#
# That is not hypothetical here. 4784e44 floated @playwright/test up from a pin
# ed7d2d9 had placed deliberately, inside the npm-minor-and-patch group, past a
# gate that could not see what the pin was holding down. The live site then
# served a build older than main until it was found by hand.
#
# So the gate a bump merges against is now literally the gate the deploy runs --
# one `build` job, depended on by both `deploy` and `dependabot-auto-merge`.
# ci.yml is deleted rather than kept beside it: a second copy of a gate is how
# the two drifted apart in the first place.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait on.
  pull_request:
    branches: [main]
  # Required by the post-merge dispatch at the bottom of this file.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`. Now that pull_request is a trigger and
  # cancel-in-progress is on, a bare group would let a PR run cancel a live main
  # deploy -- and `cancelled` is one of the shapes that ships nothing while
  # looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22, not 20: `npm test` runs node --experimental-strip-types, which
          # does not exist before 22.6. That version gap is the reason the engine
          # tests lived in ci.yml and never ran on this side.
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Engine tests (E91 simulation vectors)
        run: npm test

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs every spec in e2e/: the axe WCAG A/AA scan AND the rendered-claim
      # assertions in claims.spec.ts (verdict, counters, failure paths).
      - name: Browser gate (axe-core WCAG A/AA + rendered-claim assertions)
        run: npm run test:a11y

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # A pull request is gated, never published. `!= 'pull_request'` and NOT
    # `== 'push'`: the latter reads as equivalent and also skips
    # workflow_dispatch, which is the one trigger the post-merge dispatch below
    # depends on -- the dispatched run would build, pass the gate, skip this job,
    # and leave the site exactly as stale as it was.
    #
    # Note this is safe to gate only because build and deploy are separate jobs.
    # Where they are one job, gating it off for pull requests disables the PR
    # gate itself, so the PR runs nothing and reports nothing.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument, and it is the
  # SAME build job `deploy` needs -- so a bump cannot merge unless the thing that
  # would later block the deploy has already gone green on the PR.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- engine tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # The filename below has to be the one THIS repo has. It is deploy.yml here;
          # some labs have deploy-pages.yml, and copying a reference lab verbatim
          # gives a 404 that fails only on the auto-merge path, only after the merge
          # has already landed -- the same silent non-deploy this step exists to stop.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
